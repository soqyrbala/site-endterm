<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Steppe &amp; Peaks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark site-nav">
      <div class="container">
        <a class="navbar-brand" href="index.html">Steppe &amp; Peaks</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="about.html">About</a></li><li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li><li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li><li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li><li class="nav-item"><a class="nav-link" href="destinations.html#favorites">Favorites <span id="fav-count" class="badge rounded-pill fav-badge">0</span></a></li><li class="nav-item"><button id="theme-toggle" type="button" class="btn btn-sm btn-outline-light ms-md-2 my-1 my-md-0" aria-pressed="false">Dark mode</button></li></ul></div>
      </div>
    </nav>
  </header>
  <main class="container py-5">
    <section class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <h2 class="text-center mb-4">Book a trip</h2>

        <div id="form-success" class="alert alert-success d-none" role="status"></div>

        <form id="contact-form" action="#" method="post" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" data-validate autocomplete="name" aria-describedby="name-error" aria-required="true">
            <div class="invalid-feedback" id="name-error"></div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" data-validate autocomplete="email" aria-describedby="email-error" aria-required="true">
            <div class="invalid-feedback" id="email-error"></div>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone <span class="small fw-normal">(optional)</span></label>
            <input type="tel" class="form-control" id="phone" data-validate autocomplete="tel" placeholder="+7 701 123 4567" aria-describedby="phone-error">
            <div class="invalid-feedback" id="phone-error"></div>
          </div>
          <div class="mb-3">
            <label for="tour" class="form-label">Tour</label>
            <select class="form-select" id="tour" data-validate aria-describedby="tour-error" aria-required="true">
              <option value="">Choose a tour...</option>
            </select>
            <div class="invalid-feedback" id="tour-error"></div>
          </div>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="travellers" class="form-label">Travellers (1-8)</label>
              <input type="number" class="form-control" id="travellers" data-validate value="2" min="1" max="8" aria-describedby="travellers-error" aria-required="true">
              <div class="invalid-feedback" id="travellers-error"></div>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="date" class="form-label">Start date</label>
              <input type="date" class="form-control" id="date" data-validate aria-describedby="date-error" aria-required="true">
              <div class="invalid-feedback" id="date-error"></div>
            </div>
          </div>
          <div id="price-estimate" class="price-estimate mb-3" aria-live="polite"></div>
          <div class="mb-3">
            <label for="msg" class="form-label">Message</label>
            <textarea class="form-control" id="msg" rows="4" data-validate aria-describedby="msg-error msg-count" aria-required="true"></textarea>
            <div class="invalid-feedback" id="msg-error"></div>
            <div id="msg-count" class="small text-end">0 / 500</div>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="agree" data-validate aria-describedby="agree-error">
            <label for="agree" class="form-check-label">I agree to be contacted about this request.</label>
            <div class="invalid-feedback" id="agree-error"></div>
          </div>
          <button type="submit" class="btn btn-saffron w-100">Send request</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="py-4 text-center"><p class="mb-0">&copy; 2026 Steppe &amp; Peaks. Travel Kazakhstan.</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
